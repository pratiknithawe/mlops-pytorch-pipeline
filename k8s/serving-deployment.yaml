apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: model-serving}
  template:
    metadata:
      labels: {app: model-serving}
    spec:
      containers:
        - name: model-server
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          env:
            - {name: MODEL_PATH, value: /app/checkpoints/classifier_v1.pt}
            - {name: MODEL_ARCHITECTURE, value: resnet18}
            - {name: NUM_CLASSES, value: "10"}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: checkpoint-storage, mountPath: /app/checkpoints, readOnly: true}
      volumes:
        - name: checkpoint-storage
          persistentVolumeClaim: {claimName: mlops-data-checkpoints}
