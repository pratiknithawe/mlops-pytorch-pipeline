apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-data-checkpoints
  namespace: ml-training
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-training
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: pytorch-training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: training-config, mountPath: /app/configs, readOnly: true}
            - {name: training-storage, mountPath: /app/data}
            - {name: training-storage, mountPath: /app/checkpoints}
      volumes:
        - name: training-config
          configMap: {name: training-config}
        - name: training-storage
          persistentVolumeClaim: {claimName: mlops-data-checkpoints}
